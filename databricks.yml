  #   workspace:
  #     host: https://REPLACE_WITH_BIMBO_PROD_WORKSPACE_URL
  #     root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
  #   permissions: # access to the deployed bundle folder
  #     - level: CAN_MANAGE
